<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projekt 7a</title>
<meta name="theme-color" content="#EBF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: Ein-Spalten-Phone-App (Pixel 8, ~412px). Sticky Kopf, 4 Ansichten, feste Tab-Leiste unten. */
:root{
  --bg:#EBF0EE; --surface:#F8FAF9; --fig:#DCE6E2; --fg:#13201D; --muted:#556661; --line:#C9D5D1;
  --accent:#0B6A62; --accent-ink:#FFFFFF; --accent-soft:#CBE5E0; --warn:#B3441E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#162120; --fig:#1D2B28; --fg:#E4ECE9; --muted:#93A8A1; --line:#283936;
  --accent:#4FD1B8; --accent-ink:#04201B; --accent-soft:#1C3A35; --warn:#F08A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#162120; --fig:#1D2B28; --fg:#E4ECE9; --muted:#93A8A1; --line:#283936;
  --accent:#4FD1B8; --accent-ink:#04201B; --accent-soft:#1C3A35; --warn:#F08A5D; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--body);
  padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,.fig:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font:700 32px/0.95 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sub{font:600 14px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stw{font-size:12px;color:var(--warn);text-align:right;max-width:40%}
main{display:flex;flex-direction:column;gap:16px;padding-block:14px 0}
.lbl{font:600 14px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;
  color:var(--muted);font:600 12px/1 var(--body);letter-spacing:.02em;border-radius:12px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab svg{width:24px;height:24px}

/* Figuren */
.figwrap{min-width:0}
.fig{position:relative;background:var(--fig);border-radius:10px;overflow:hidden;aspect-ratio:3/2;cursor:pointer}
.fig svg{display:block;width:100%;height:100%}
.figcap{font-size:14px;line-height:1.3;color:var(--muted);margin-top:8px;min-height:2.6em}
.p{transition:opacity .35s}
.figwrap[data-frame="0"] .p1,.figwrap[data-frame="1"] .p0{opacity:0}
.fl{stroke:var(--muted);stroke-opacity:.5;stroke-width:2}
.torso{stroke:var(--fg);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
.limb{stroke:var(--fg);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hd{fill:var(--fg)}
.mk{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:1.5}
.pr{fill:var(--muted);fill-opacity:.35}
.wall{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.wt{fill:var(--accent-soft);stroke:var(--fg);stroke-width:2.5}
.arrow{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.torso.a,.limb.a{stroke:var(--accent)}
.torso.w,.limb.w{stroke:var(--warn)}

/* Training */
.dnav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.sq{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dl{text-align:center;display:flex;flex-direction:column;align-items:center;min-height:48px;justify-content:center}
.dl b{font:700 24px/1.05 var(--display);letter-spacing:.02em}
.dl span,.lnk{font-size:13px;color:var(--muted)}
.lnk{background:none;border:0;padding:2px 8px;color:var(--accent);font-weight:600;text-decoration:underline;min-height:40px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{position:relative;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seg .sk{font:700 22px/1 var(--display)}
.seg .sl{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] .sl{color:var(--accent-ink);opacity:.85}
.seg .pl::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.seg [aria-pressed="true"].pl::after{background:var(--accent-ink)}
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#pgTxt{font:600 15px var(--display);letter-spacing:.04em;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exh{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.exm{display:flex;flex-direction:column;gap:4px;min-width:0}
.exm h3{font:600 16px/1.25 var(--body)}
.dose{font:600 22px/1.05 var(--display);letter-spacing:.02em}
.how-b{align-self:flex-start;background:none;border:0;padding:0;min-height:32px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-width:52px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:700 20px var(--display);user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exh.nf{grid-template-columns:minmax(0,1fr)}
select,#tops{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
#tops{width:84px;text-align:center}
.kg{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:14px;color:var(--muted)}
.kg input{width:80px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.tbtn{height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);
  font:700 18px var(--display);letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tbtn.run{background:var(--accent-soft)}
.how{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.how ol{list-style:decimal;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.err{color:var(--muted)}
.err b{color:var(--warn)}

textarea{width:100%;min-height:76px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;resize:vertical}
.cta{width:100%;min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);
  font:700 20px var(--display);letter-spacing:.08em;text-transform:uppercase}
.cta.undo{background:var(--accent-soft);color:var(--accent)}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:600}
.btn.arm{background:var(--warn);border-color:var(--warn);color:#fff}

/* Plan */
.week li{display:grid;grid-template-columns:34px 30px minmax(0,1fr);gap:10px;align-items:start;padding:10px 8px;border-bottom:1px solid var(--line)}
.week li.now{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.week b{font:700 20px/1.2 var(--display)}
.tag{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font:700 17px var(--display);background:var(--fg);color:var(--bg)}
.tag.kM{background:var(--accent-soft);color:var(--accent)}
.week span.t{font-size:15px}
.sesl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sesl .dz{font:600 18px var(--display);letter-spacing:.03em;text-align:right}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box h2{font:700 22px/1.1 var(--display);letter-spacing:.03em}
.ph li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ph b{font:700 18px/1.2 var(--display);letter-spacing:.03em}
input[type=date]{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Kalender */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.mnav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.mnav b{text-align:center;font:700 24px var(--display);letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font:600 13px var(--display);text-align:center;color:var(--muted);letter-spacing:.08em;padding:2px 0}
.cd{min-height:54px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.cd b{font:700 19px/1 var(--display);font-variant-numeric:tabular-nums}
.cd i{font:600 11px/1 var(--body);font-style:normal;color:var(--muted)}
.cd.part{background:var(--accent-soft)}
.cd.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cd.done i{color:var(--accent-ink);opacity:.85}
.cd.done.kM{background:var(--accent-soft);color:var(--accent)}
.cd.done.kM i{color:var(--accent);opacity:1}
.cd.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cd.sel{box-shadow:inset 0 0 0 2.5px var(--fg)}
.cd.blank{visibility:hidden}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line);background:var(--surface)}
.leg .l1::before{background:var(--accent);border-color:var(--accent)}
.leg .l2::before{background:var(--accent-soft);border-color:var(--accent)}
.leg .l3::before{background:var(--accent-soft)}
.det{display:flex;flex-direction:column;gap:6px}
.det h2{font:700 22px/1.1 var(--display);letter-spacing:.03em}
#imp{min-height:90px;font-size:14px}

/* Übungen */
.lib{display:flex;flex-direction:column;gap:12px}
.lib .bd{align-self:flex-start;font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var GROUPS=[['Kraft',['thrust','rdl','bulgarian','bridge','bandwalk','bpa']],['Core',['deadbug','plank']],['Mobility',['hipflex','couch','catcow','towelext']],['Hangboard und Klimmen',['hang','scap','rep','pullup','pushup','wrist','kraise']],['Spannung für Überhang',['hollow','hamcurl','lockoff','squat']]];

/* ---------- Figuren-Rendering ---------- */
function figSVG(id){
  var x=EX[id];
  if(x._svg)return x._svg;
  var xs=[];
  x.F.forEach(function(f){
    xs.push(f.h[0]-9,f.h[0]+9);
    f.L.forEach(function(l){l.slice(1).forEach(function(p){xs.push(p[0])})});
    (f.W||[]).forEach(function(w){xs.push(w[0]-7,w[0]+7)});
    if(f.M)xs.push(f.M[0]-12,f.M[0]+12);
  });
  x.P.forEach(function(p){if(p[0]==='rect')xs.push(p[1],p[1]+p[3]);else if(p[0]==='circ')xs.push(p[1]-p[3],p[1]+p[3]);else xs.push(p[1])});
  var dx=Math.round(120-(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2);
  var props=x.P.map(function(p){
    if(p[0]==='rect')return '<rect class="pr" x="'+p[1]+'" y="'+p[2]+'" width="'+p[3]+'" height="'+p[4]+'" rx="3"/>';
    if(p[0]==='circ')return '<circle class="pr" cx="'+p[1]+'" cy="'+p[2]+'" r="'+p[3]+'"/>';
    return '<line class="wall" x1="'+p[1]+'" y1="'+p[2]+'" x2="'+p[1]+'" y2="'+p[3]+'"/>';
  }).join('');
  var fr=x.F.map(function(f,i){
    var s='<g class="p p'+i+'">';
    if(f.M)s+='<circle class="mk" cx="'+f.M[0]+'" cy="'+f.M[1]+'" r="12"/>';
    f.L.forEach(function(l){s+='<polyline class="'+l[0]+'" points="'+l.slice(1).map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>'});
    (f.W||[]).forEach(function(w){s+='<circle class="wt" cx="'+w[0]+'" cy="'+w[1]+'" r="7"/>'});
    s+='<circle class="hd" cx="'+f.h[0]+'" cy="'+f.h[1]+'" r="8.5"/></g>';
    return s;
  }).join('');
  x._svg='<svg viewBox="0 0 240 160" role="img" aria-label="'+esc(x.n)+'"><line class="fl" x1="12" y1="148" x2="228" y2="148"/><g transform="translate('+dx+' '+(148-x.fl)+')">'+props+fr+'</g></svg>';
  return x._svg;
}
function fig(id,big){
  return '<div class="figwrap" data-ex="'+id+'" data-frame="0"><div class="fig" tabindex="0" role="button" aria-label="Phase wechseln: '+esc(EX[id].n)+'">'+figSVG(id)+'</div>'+(big?'<div class="figcap" aria-live="off"></div>':'')+'</div>';
}
var fr=0;
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
function setFrame(el,f){
  el.dataset.frame=String(f);
  var c=$('.figcap',el);
  if(c)c.textContent=EX[el.dataset.ex].F[f].t;
}
function syncFigs(){$$('.figwrap').forEach(function(el){setFrame(el,fr)})}
setInterval(function(){
  if(document.hidden||RM.matches)return;
  fr=fr?0:1;syncFigs();
},1600);

/* ---------- Speicher ---------- */
var KEY='hueft-gesaess-v1';
var S={start:null,log:{}};
var storeOk=true;
var today=ymd(new Date());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOk=true}catch(e){storeOk=false}}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);if(o&&typeof o.log==='object'&&o.log)S={start:o.start||null,log:o.log}}
  }catch(e){storeOk=false}
  if(!S.start){S.start=today;save()}
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storeOk=false}
}
function ent(d,create){if(!S.log[d]&&create)S.log[d]={sets:{},kg:{}};var e=S.log[d];if(e){e.sets=e.sets||{};e.kg=e.kg||{}}return e}
var planFor=function(d){return PLAN[parse(d).getDay()]};
var sesOf=function(d){var e=S.log[d];return (e&&e.s&&SES[e.s])?e.s:planFor(d)};
function countDone(d){
  var e=S.log[d],done=0,total=0;
  SES[sesOf(d)].ex.forEach(function(x){
    total+=x[1];
    var a=e&&e.sets&&e.sets[x[0]];
    if(a)for(var i=0;i<x[1];i++)if(a[i])done++;
  });
  return {done:done,total:total};
}
function toggleSet(d,id,i,n){
  var e=ent(d,true);
  var a=e.sets[id];
  if(!a){a=[];for(var k=0;k<n;k++)a.push(0);e.sets[id]=a}
  a[i]=a[i]?0:1;save();return a[i];
}
function lastKg(id,before){
  var ks=Object.keys(S.log).filter(function(k){return k<before}).sort().reverse();
  for(var i=0;i<ks.length;i++){var e=S.log[ks[i]];if(e&&e.kg&&e.kg[id])return e.kg[id]}
  return '';
}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function weekCnt(m,ks){var c=0;for(var i=0;i<7;i++){var d=addDays(m,i),e=S.log[d];if(e&&e.done&&ks.indexOf(sesOf(d))>-1)c++}return c}
function weekOk(m){return weekCnt(m,['A','B','W'])>=3&&weekCnt(m,['C'])>=2}
function streak(){
  var m=mondayOf(today),n=0;
  if(weekOk(m))n++;
  m=addDays(m,-7);
  while(n<520&&weekOk(m)){n++;m=addDays(m,-7)}
  return n;
}
var PH=[[8,'Basis'],[20,'Kraft'],[36,'Limit'],[52,'Peak']];
function weekInfo(d){
  var days=Math.round((parse(d)-parse(S.start))/864e5);
  var n=Math.max(1,Math.floor(days/7)+1),ph='Peak';
  for(var i=0;i<PH.length;i++){if(n<=PH[i][0]){ph=PH[i][1];break}}
  return {n:n,ph:ph+(n%4===0?' · Deload':'')};
}

/* ---------- Ansichten ---------- */
var cur=today,tab='training';
var CM={y:new Date().getFullYear(),m:new Date().getMonth()},SEL=today;

function exCard(d,id,n,e){
  var x=EX[id],arr=(e.sets&&e.sets[id])||[];
  var chips='';
  for(var i=0;i<n;i++)chips+='<button class="chip'+(arr[i]?' on':'')+'" data-act="set" data-ex="'+id+'" data-i="'+i+'" data-n="'+n+'" aria-pressed="'+(arr[i]?'true':'false')+'" aria-label="Satz '+(i+1)+'">'+(i+1)+'</button>';
  var kg='';
  if(x.kg){
    var v=(e.kg&&e.kg[id])||'',lk=lastKg(id,d);
    kg='<label class="kg">kg<input id="kg-'+id+'" type="number" inputmode="decimal" step="2.5" data-act="kg" data-ex="'+id+'" value="'+esc(v)+'" placeholder="'+(lk||'–')+'"></label>';
  }
  var tm=x.secs?'<button class="tbtn" data-act="timer" data-ex="'+id+'">'+I.p+'<span>'+tLabel(id)+'</span></button>':'';
  return '<article class="ex"><div class="exh'+(x.nofig?' nf':'')+'">'+(x.nofig?'':fig(id,false))+'<div class="exm"><h3>'+esc(x.n)+'</h3><div class="dose">'+(x.once?esc(x.rep):n+' × '+esc(x.rep))+'</div><button class="how-b" data-act="how" aria-expanded="false">Anleitung</button></div></div>'
   +'<div class="ctl">'+chips+tm+kg+'</div>'
   +'<div class="how" hidden>'+howHTML(x)+'</div></article>';
}
function howHTML(x){
  return '<ol>'+x.cues.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ol><p class="err"><b>Typischer Fehler:</b> '+esc(x.err)+'</p>';
}
function tLabel(id){var x=EX[id];return (x.sides?x.secs*2:x.secs)+' s'}

function vTraining(){
  var d=cur,k=sesOf(d),e=S.log[d]||{},P=planFor(d),dt=parse(d),c=countDone(d);
  var lab=DN[dt.getDay()]+', '+dt.getDate()+'. '+MN[dt.getMonth()];
  var h='<div class="dnav"><button class="sq" data-act="prev" aria-label="Vortag">'+I.l+'</button><div class="dl"><b>'+lab+'</b>'
   +(d===today?'<span>Heute</span>':'<button class="lnk" data-act="gototoday">Zu heute springen</button>')+'</div><button class="sq" data-act="next" aria-label="Folgetag">'+I.r+'</button></div>';
  h+='<div class="seg" role="group" aria-label="Einheit wählen">'+['A','B','W','C','K','M'].map(function(x){
    return '<button data-act="ses" data-k="'+x+'" aria-pressed="'+(x===k)+'" class="'+(x===P?'pl':'')+'"><span class="sk">'+x+'</span><span class="sl">'+SES[x].s+'</span></button>';
  }).join('')+'</div>';
  h+='<p class="small muted" style="margin-top:-8px">Punkt = laut Wochenplan'+(k!==P?'. Abweichung: Plan wäre '+SES[P].n:'')+'</p>';
  h+='<div class="prog"><div class="bar"><i id="pgBar" style="width:'+(c.total?Math.round(c.done/c.total*100):0)+'%"></i></div><span id="pgTxt">'+c.done+' / '+c.total+' Sätze</span></div>';
  if(SES[k].note)h+='<p class="small muted">'+esc(SES[k].note)+'</p>';
  h+=SES[k].ex.map(function(x){return exCard(d,x[0],x[1],e)}).join('');
  if(k==='C'){
    h+='<section class="box"><h2>Heute geklettert</h2><div class="row"><label for="topg" class="small muted">Höchster Top</label><select id="topg"><option value="">–</option>'+GRADES.map(function(g){return '<option'+(e.top===g?' selected':'')+'>'+g+'</option>'}).join('')+'</select><label for="tops" class="small muted">Tops</label><input id="tops" type="number" inputmode="numeric" min="0" step="1" value="'+(e.tops!=null?e.tops:'')+'"></div></section>';
  }
  h+='<div><div class="lbl" style="margin-bottom:6px">Notiz</div><textarea id="note" data-act="note" placeholder="Gewichte, Schmerzen, Gefühl">'+esc(e.note||'')+'</textarea></div>';
  h+='<button class="cta'+(e.done?' undo':'')+'" data-act="done">'+(e.done?'Abgeschlossen · zurücknehmen':'Training abschließen')+'</button>';
  return h;
}

function vPlan(){
  var wi=weekInfo(today),tdw=parse(today).getDay();
  var h='<section class="box"><h2>Wochenplan</h2><ul class="week">'+[1,2,3,4,5,6,0].map(function(w){
    var k=PLAN[w];
    return '<li class="'+(w===tdw?'now':'')+'"><b>'+DN[w]+'</b><span class="tag k'+k+'">'+k+'</span><span class="t"><b style="font-size:17px">'+SES[k].s+'</b><br><span class="muted">'+SES[k].ex.map(function(x){return EX[x[0]].n}).join(' · ')+'</span></span></li>';
  }).join('')+'</ul><p class="small muted">Kraft Mo, Mi, Fr. An den anderen Tagen nur Mobility (ca. 8 min). Ziel pro Woche: 3 Kraft-Einheiten (W, A, B) und 2 Klettereinheiten (C). K (Hangboard) ist ein optionaler Zusatz, wegen des Daumens vorsichtig. Die Tage lassen sich im Training-Tab pro Tag ändern.</p></section>';
  ['A','B','W','C','K','M'].forEach(function(k){
    h+='<section class="box"><h2>'+SES[k].n+'</h2><ul class="sesl">'+SES[k].ex.map(function(x){
      return '<li><span>'+esc(EX[x[0]].n)+'</span><span class="dz">'+(EX[x[0]].once?'':x[1]+' × ')+esc(EX[x[0]].d||EX[x[0]].rep.split(' · ')[0])+'</span></li>';
    }).join('')+'</ul>'+(SES[k].note?'<p class="small muted">'+esc(SES[k].note)+'</p>':'')+'</section>';
  });
  h+='<section class="box"><h2>Phasen bis 7a</h2><ul class="ph">'
   +'<li><b>Wo 1–8<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Basis</span></b><span>Spannung und Technik: C-Drills, W-Einheit. Klimmzüge sauber von 5–6 auf 7.</span></li>'
   +'<li><b>Wo 9–20<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Kraft</span></b><span>Lock-off 10 s, Klimmzüge Richtung 8 bis 10, leichte Repeaters. Daumen langsam belasten.</span></li>'
   +'<li><b>Wo 21–36<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Limit</span></b><span>Mehr Projekte (6c+/7a), A und B nur noch 1× pro Woche.</span></li>'
   +'<li><b>Wo 37–52<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Peak</span></b><span>Qualität statt Menge, 7a-Versuche ausgeruht.</span></li></ul>'
   +'<p class="small muted">Jede 4. Woche Deload: Umfang halbieren. Das sind Richtwerte, keine Garantie. Nach 4 Wochen anpassen.</p></section>';
  h+='<section class="box"><h2>Steigerung</h2><ul class="ph">'
   +'<li><b>Woche 1–2<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Technik</span></b><span>Körpergewicht oder leichte Hantel. Bewegung sauber, Rippen unten, Becken kontrolliert.</span></li>'
   +'<li><b>Woche 3–4<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Aufbau</span></b><span>Alle Sätze voll. Last so wählen, dass die letzten 2 Wiederholungen fordern, aber sauber bleiben.</span></li>'
   +'<li><b>Ab Woche 5<br><span class="muted small" style="font-weight:400;font-family:var(--body)">Last steigern</span></b><span>Wenn alle Sätze sauber gelingen: Gewicht um 2,5 kg erhöhen. Das ist ein Richtwert, kein Muss.</span></li></ul>'
   +'<div class="row"><label for="start" class="small muted">Plan-Start</label><input id="start" type="date" value="'+S.start+'"></div>'
   +'<p class="small muted">Aktuell: Woche '+wi.n+' · '+wi.ph+'</p></section>';
  h+='<section class="box"><h2>Hinweise</h2><ul style="display:flex;flex-direction:column;gap:8px;font-size:15px">'
   +'<li>Warum: Kippt das Becken nach vorn, entsteht ein Hohlkreuz. Schwaches Gesäß und schwacher Bauch sowie verkürzte Hüftbeuger halten es dort. Training und Dehnung greifen beides an.</li>'
   +'<li>Brustwirbelsäule: Katze-Kuh, Handtuchrolle und Band Pull-Apart zielen auf den mittleren Rücken. Wirkung ist individuell.</li>'
   +'<li>Hangboard: Finger brauchen länger zur Anpassung als Muskeln. Langsam steigern, bei stechendem Schmerz am Finger oder Ringband pausieren.</li>'
   +'<li>Stopp bei Schmerz (nicht Muskelbrennen), Kribbeln oder Taubheit. Dann ärztlich oder physiotherapeutisch abklären.</li>'
   +'<li>Schmerz hinter dem Brustbein mit Druck, Enge, Atemnot, Ausstrahlung in Arm oder Kiefer: sofort Notruf.</li></ul></section>';
  return h;
}

function vCal(){
  var first=new Date(CM.y,CM.m,1),off=(first.getDay()+6)%7,dim=new Date(CM.y,CM.m+1,0).getDate();
  var mk=mondayOf(today);
  var h='<div class="stats"><div class="stat"><b>'+weekCnt(mk,['A','B','W'])+'/3</b><span>Kraft diese Woche</span></div><div class="stat"><b>'+weekCnt(mk,['C'])+'/2</b><span>Klettern</span></div><div class="stat"><b>'+streak()+'</b><span>Wochen-Serie</span></div></div>';
  h+='<div class="mnav"><button class="sq" data-act="cprev" aria-label="Vormonat">'+I.l+'</button><b>'+MN[CM.m]+' '+CM.y+'</b><button class="sq" data-act="cnext" aria-label="Folgemonat">'+I.r+'</button></div>';
  h+='<div class="grid">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<div class="cd blank"></div>';
  for(var n=1;n<=dim;n++){
    var s=ymd(new Date(CM.y,CM.m,n)),e=S.log[s],k=sesOf(s),c=countDone(s);
    var cls='cd k'+k+(e&&e.done?' done':(c.done>0?' part':''))+(s===today?' today':'')+(s===SEL?' sel':'');
    var st=e&&e.done?'erledigt':(c.done>0?'teilweise':'offen');
    h+='<button class="'+cls+'" data-act="day" data-d="'+s+'" aria-label="'+n+'. '+MN[CM.m]+', Einheit '+k+', '+st+'"><b>'+n+'</b><i>'+k+'</i></button>';
  }
  h+='</div><div class="leg"><span class="l1">Kraft erledigt</span><span class="l2">Mobility erledigt</span><span class="l3">teilweise</span></div>';
  var e2=S.log[SEL],k2=sesOf(SEL),c2=countDone(SEL),dt=parse(SEL);
  var kgs=SES[k2].ex.filter(function(x){return e2&&e2.kg&&e2.kg[x[0]]}).map(function(x){return esc(EX[x[0]].n)+' '+e2.kg[x[0]]+' kg'});
  h+='<section class="box det"><h2>'+DN[dt.getDay()]+', '+dt.getDate()+'. '+MN[dt.getMonth()]+'</h2><p>'+SES[k2].n+' · '+(e2&&e2.done?'erledigt':'nicht abgeschlossen')+' · '+c2.done+'/'+c2.total+' Sätze</p>'
   +(e2&&e2.top?'<p class="small muted">Höchster Top '+esc(e2.top)+' · '+(e2.tops||0)+' Tops</p>':'')+(kgs.length?'<p class="small muted">'+kgs.join(' · ')+'</p>':'')+(e2&&e2.note?'<p class="small muted">Notiz: '+esc(e2.note)+'</p>':'')
   +'<button class="btn" data-act="open" style="align-self:flex-start">Öffnen und bearbeiten</button></section>';
  var cl=Object.keys(S.log).filter(function(k){var e=S.log[k];return e&&(e.top||e.tops)}).sort().reverse(),best=-1;
  cl.forEach(function(k){var gi=GRADES.indexOf(S.log[k].top);if(gi>best)best=gi});
  h+='<section class="box"><h2>Kletter-Log</h2>'+(cl.length?'<ul class="sesl">'+cl.slice(0,8).map(function(k){var e=S.log[k],dt=parse(k);return '<li><span>'+dt.getDate()+'. '+MN[dt.getMonth()].slice(0,3)+'</span><span class="dz">'+esc(e.top||'–')+' · '+(e.tops||0)+' Tops</span></li>'}).join('')+'</ul>':'<p class="small muted">Noch keine Einträge. Trage in der Klettereinheit Top-Grad und Tops ein.</p>')+'<p class="small muted">Höchster Top bisher: '+(best>-1?GRADES[best]:'–')+' · Ziel: 7a</p></section>';
  h+='<section class="box"><h2>Daten sichern</h2><p class="small muted">Alles liegt nur in diesem Browser. Beim Löschen der Website-Daten gehen die Einträge verloren. Kopiere sie deshalb ab und zu in eine Notiz.</p>'
   +'<div class="row"><button class="btn" data-act="copy">Daten kopieren</button><button class="btn" data-act="import">Importieren</button></div>'
   +'<textarea id="imp" aria-label="Sicherungstext" placeholder="Sicherung hier einfügen, dann Importieren tippen"></textarea><p class="small muted" id="bmsg" role="status"></p></section>';
  return h;
}

  var h='<p class="small muted">Schematische Strichfiguren, keine Fotos. Tippe auf ein Bild, um die Phase zu wechseln. Farbige Fläche = Zielbereich.</p>';

var V={training:vTraining,plan:vPlan,kalender:vCal,uebungen:vEx};

function render(){
  today=ymd(new Date());
  stopT();
  $('#view').innerHTML=V[tab]();
  $$('.tab').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  var wi=weekInfo(tab==='training'?cur:today);
  $('#sub').textContent='Woche '+wi.n+' · '+wi.ph;
  $('#stw').hidden=storeOk;
  syncFigs();
}
function route(){
  var h=location.hash.slice(1);
  tab=V[h]?h:'training';
  render();window.scrollTo(0,0);
}

/* ---------- Timer ---------- */
var T=null,wl=null,ac=null;
function beep(f,len){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+len);
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate(len>.3?[200,100,200]:120)}catch(e){}
}
function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})},function(){})}catch(e){}}
function tBtn(id){return $('[data-act="timer"][data-ex="'+id+'"]')}
function stopT(){
  if(!T)return;
  clearInterval(T.iv);
  var b=tBtn(T.id);
  if(b){b.classList.remove('run');var s=$('span',b);if(s)s.textContent=tLabel(T.id)}
  T=null;
  try{if(wl){wl.release();wl=null}}catch(e){}
}
function startT(id){
  var x=EX[id],total=x.secs*(x.sides?2:1);
  T={id:id,left:total,total:total,ivl:x.ivl||null,half:x.sides?x.secs:0,iv:setInterval(tick,1000)};
  var b=tBtn(id);if(b){b.classList.add('run');$('span',b).textContent=total+' s'}
  beep(x.ivl?880:660,.15);wake();
}
function tick(){
  if(!T)return;
  var b=tBtn(T.id);
  if(!b){stopT();return}
  T.left--;
  var lab=T.left+' s';
  if(T.ivl){var el=T.total-T.left,cyc=T.ivl[0]+T.ivl[1],m=el%cyc;lab=(m<T.ivl[0]?'Hang ':'Pause ')+T.left+' s';if(m===0&&el>0)beep(880,.15);if(m===T.ivl[0])beep(440,.3)}
  $('span',b).textContent=lab;
  if(T.half&&T.left===T.half)beep(880,.5);
  if(T.left<=0){
    var id=T.id;stopT();beep(660,.6);
    var chips=$$('.chip[data-ex="'+id+'"]');
    for(var i=0;i<chips.length;i++){
      if(!chips[i].classList.contains('on')){
        var on=toggleSet(cur,id,+chips[i].dataset.i,+chips[i].dataset.n);
        chips[i].classList.toggle('on',!!on);chips[i].setAttribute('aria-pressed',on?'true':'false');break;
      }
    }
    updProg();
  }
}
function updProg(){
  var c=countDone(cur),b=$('#pgBar');
  if(b){b.style.width=(c.total?Math.round(c.done/c.total*100):0)+'%';$('#pgTxt').textContent=c.done+' / '+c.total+' Sätze'}
}
function msg(t){var m=$('#bmsg');if(m)m.textContent=t}
function copyTxt(txt){
  var ta=$('#imp');
  var fb=function(){ta.value=txt;ta.focus();ta.select();msg('Kopieren blockiert. Text ist markiert, bitte manuell kopieren.')};
  try{navigator.clipboard.writeText(txt).then(function(){msg('Kopiert. In einer Notiz sichern.')},fb)}catch(e){fb()}
}

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  var f=ev.target.closest('.fig');
  if(f){var w=f.parentNode;setFrame(w,w.dataset.frame==='0'?1:0);return}
  var tb=ev.target.closest('[data-tab]');
  if(tb){var h='#'+tb.dataset.tab;if(location.hash===h)route();else location.hash=h;return}
  var t=ev.target.closest('[data-act]');
  if(!t)return;
  var a=t.dataset.act;
  if(a==='set'){
    var on=toggleSet(cur,t.dataset.ex,+t.dataset.i,+t.dataset.n);
    t.classList.toggle('on',!!on);t.setAttribute('aria-pressed',on?'true':'false');updProg();
  }else if(a==='how'){
    var hw=t.closest('.ex').querySelector('.how');hw.hidden=!hw.hidden;t.setAttribute('aria-expanded',String(!hw.hidden));t.textContent=hw.hidden?'Anleitung':'Schließen';
  }else if(a==='timer'){
    var id=t.dataset.ex,same=T&&T.id===id;
    stopT();if(!same)startT(id);
  }else if(a==='ses'){
    var e=ent(cur,true);
    if(t.dataset.k===planFor(cur))delete e.s;else e.s=t.dataset.k;
    save();render();
  }else if(a==='prev'){cur=addDays(cur,-1);render()}
  else if(a==='next'){cur=addDays(cur,1);render()}
  else if(a==='gototoday'){cur=today;render()}
  else if(a==='done'){var e2=ent(cur,true);e2.done=!e2.done;save();render()}
  else if(a==='cprev'){CM.m--;if(CM.m<0){CM.m=11;CM.y--}render()}
  else if(a==='cnext'){CM.m++;if(CM.m>11){CM.m=0;CM.y++}render()}
  else if(a==='day'){SEL=t.dataset.d;render()}
  else if(a==='open'){cur=SEL;if(location.hash==='#training')route();else location.hash='#training'}
  else if(a==='copy'){copyTxt(JSON.stringify(S))}
  else if(a==='import'){
    var raw=$('#imp').value.trim();
    if(!raw){msg('Das Feld ist leer.');return}
    if(t.dataset.armed!=='1'){t.dataset.armed='1';t.classList.add('arm');t.textContent='Ersetzt alle Daten. Nochmal tippen.';return}
    try{
      var o=JSON.parse(raw);
      if(!o||typeof o.log!=='object'||!o.log)throw new Error('x');
      S={start:o.start||today,log:o.log};save();render();msg('Importiert.');
    }catch(er){t.dataset.armed='';t.classList.remove('arm');t.textContent='Importieren';msg('Ungültige Daten. Es wurde nichts geändert.')}
  }
});
document.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('fig')){ev.preventDefault();ev.target.click()}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.act==='kg'){
    var e=ent(cur,true),v=parseFloat(String(t.value).replace(',','.'));
    if(isNaN(v)||v===0)delete e.kg[t.dataset.ex];else e.kg[t.dataset.ex]=v;
    save();
  }else if(t.id==='note'){
    var e3=ent(cur,true);e3.note=t.value;save();
  }else if(t.id==='tops'){
    var e4=ent(cur,true),nv=parseInt(t.value,10);if(isNaN(nv))delete e4.tops;else e4.tops=nv;save();
  }else if(t.id==='topg'){
    var e5=ent(cur,true);if(t.value)e5.top=t.value;else delete e5.top;save();
  }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='start'&&ev.target.value){S.start=ev.target.value;save();render()}
});
window.addEventListener('hashchange',route);

load();
route();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
